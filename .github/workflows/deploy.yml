name: Validar y desplegar chat en Render

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas automáticas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09a7068a-ddc2-45e7-99d6-ab8904546743/antes
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 09a7068a-ddc2-45e7-99d6-ab8904546743/antes/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

  deploy:
    name: Solicitar despliegue en Render
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar despliegue
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --get --data-urlencode "ref=${GITHUB_SHA}" \
            "$RENDER_DEPLOY_HOOK_URL"
