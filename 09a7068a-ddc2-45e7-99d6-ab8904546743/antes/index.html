<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8"><title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; } body { font: 13px Helvetica, Arial; }
      form { background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px; } form button { width: 10%; background: rgb(130,224,255); border: none; padding: 10px; }
      #messages { list-style-type: none; margin: 0 0 40px; padding: 0; } #messages li { padding: 5px 10px; } #messages li:nth-child(odd) { background: #eee; }
      #nombre, #m { display: inline-block; } #m { width: 69%; margin-right: 4px; } #nombre { width: 20%; }
      .chat-image { display: block; max-height: 400px; max-width: 400px; margin-top: 6px; } .chat-video { display: block; width: 560px; max-width: 100%; height: 315px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <ul id="messages" aria-live="polite"></ul>
    <form action=""><input id="nombre" autocomplete="off" placeholder="Username" aria-label="Username"><input id="m" autocomplete="off" placeholder="Escriba un mensaje" aria-label="Escriba un mensaje"><button type="submit">Send</button></form>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      let colorHexTxt = ''; const socket = io(); const messages = document.getElementById('messages');
      function getRandomColor() { return '#' + Array.from({ length: 6 }, () => '0123456789ABCDEF'[Math.floor(Math.random() * 16)]).join(''); }
      document.querySelector('form').addEventListener('submit', (event) => {
        event.preventDefault(); const nombre = document.getElementById('nombre').value || 'Anónimo'; const mensaje = document.getElementById('m').value;
        colorHexTxt ||= getRandomColor(); socket.emit('Evento-Mensaje-Server', JSON.stringify({ nombre, mensaje, color: colorHexTxt })); document.getElementById('m').value = '';
      });
      socket.on('Evento-Mensaje-Server', (rawMessage) => {
        const message = JSON.parse(rawMessage); const item = document.createElement('li'); const author = document.createElement('b');
        author.style.color = message.color; author.textContent = `${message.nombre}: `; item.append(author);
        if (message.tipo === 'image') { const image = document.createElement('img'); image.className = 'chat-image'; image.alt = 'Imagen compartida en el chat'; image.src = message.mensaje; item.append(image); }
        else if (message.tipo === 'video') { const frame = document.createElement('iframe'); frame.className = 'chat-video'; frame.title = 'Video de YouTube compartido en el chat'; frame.src = message.mensaje; frame.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture'; frame.allowFullscreen = true; item.append(frame); }
        else { const text = document.createElement('span'); text.textContent = message.mensaje; item.append(text); }
        messages.append(item); window.scrollTo(0, document.body.scrollHeight);
      });
    </script>
  </body>
</html>
